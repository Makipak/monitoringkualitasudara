; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base]
platform = espressif32
framework = arduino

monitor_speed = 115200

; Common lib_deps shared by every board target — sensor libraries don't
; depend on which MCU/display backend is in use. Board-specific libraries
; (display: TFT_eSPI vs GFX Library for Arduino) are added per-[env] below,
; not here, since only one display backend is ever compiled per board (see
; each env's build_src_filter).
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    claws/BH1750@^1.3.0
    lewapek/Nova Fitness Sds dust sensors library@^1.4               ; SDS011 (PM2.5/PM10), replaces PMS5003
    wifwaf/MH-Z19@^1.5.4                      ; CO2, replaces SCD30. Genuine
                                               ; Winsen MH-Z19C (a prior
                                               ; Huiwen MWD1006 unit on this
                                               ; pin stopped working and was
                                               ; replaced 2026-09-01) - see
                                               ; src/sensors/mhz19c.h
    adafruit/Adafruit SGP30 Sensor@^2.0.3
    adafruit/Adafruit SHT31 Library@^2.2.2    ; GY-SHT31, room temperature
                                               ; (published + stored, excluded
                                               ; from thresholds/alerts)
    adafruit/Adafruit BusIO@^1.16.1
    ; No library entry for MiCS-4514 / Grove Multichannel Gas Sensor v2 -
    ; sensors/mics4514.cpp talks straight I2C register reads (Wire.h,
    ; already a core dependency), no external library needed. Was
    ; `Seeed_Arduino_MultiGas` pulled from GitHub, removed 2026-08-26:
    ; this physical board turned out to speak DFRobot's DFRobot_MICS
    ; register protocol, not Seeed's command protocol, despite being
    ; wired/sold as a Seeed Grove board - see mics4514.h/.cpp comments
    ; for the full story. DFRobot's library wasn't added either since
    ; the register protocol is simple enough to reimplement directly for
    ; just the one channel (NO2/OX) this project needs.

; Library status (rule.md 2: no deprecated/unmaintained deps) — re-check
; SdsDustSensor and MH-Z19 maintenance activity before relying on them for
; the actual build, since both were picked as fast substitutions when the
; originally planned sensors (PMS5003, SCD30) had long seller pre-order
; times (see architecture.md 2.1).

build_flags =
    -DMQTT_MAX_PACKET_SIZE=512        ; PubSubClient default (256B) is tight
                                      ; once device_id + 7 float params +
                                      ; temperature are serialized

; ============================================================================
; Board target 1: ESP32 DevKitC V4 (WROOM-32D) + TFT_eSPI — the original
; product decision recorded in architecture.md 2.1. This stays the DEFAULT
; environment (`pio run` with no -e picks it, since it's listed first).
; ============================================================================
[env:esp32doit-devkit-v1]
extends = base
board = esp32doit-devkit-v1
; Board id `esp32doit-devkit-v1` is the closest match in
; platformio-boards.json for a bare DevKitC V4; adjust if PlatformIO ships
; a more specific `esp32-devkitc` id by the time you build (check with
; `pio boards esp32` on your machine).
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; -DBOARD_HAS_PSRAM and similar flags are omitted — DevKitC V4 WROOM-32D
; has no PSRAM. Add if you swap to a WROVER module.
lib_deps =
    ${base.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${base.build_flags}
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h    ; final display config, see that file
build_src_filter =
    +<*>
    -<display/display_gfx.cpp>       ; Arduino_GFX backend — S3 board only,
                                      ; not a dependency of this env

; --- Temporary bench-test target: interim 2.4" ILI9341-family display --
; Only for testing firmware (sensors/network/etc.) before the ST7796 4.0"
; unit (still in transit) arrives — see architecture.md 2.2 "Catatan
; development sementara" and include/User_Setup_Dev.h. Build explicitly
; with `pio run -e esp32doit-devkit-v1-dev-display`; never the default.
[env:esp32doit-devkit-v1-dev-display]
extends = env:esp32doit-devkit-v1
build_flags =
    ${base.build_flags}
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup_Dev.h

; TFT_eSPI needs pin/driver config via a User_Setup header — each TFT_eSPI
; env above injects its own via build_flags instead of editing the
; library's bundled User_Setup.h (which `pio lib update` would overwrite).
; Without this the display library won't know which driver/pins to use and
; the build will fail.

; ============================================================================
; Board target 2: ESP32-S3 (N16R8: 16MB flash / 8MB octal PSRAM) +
; Arduino_GFX_Library — a second, PARALLEL board target ported in from the
; Arduino IDE bring-up sketch at firmware/arduino_ide/UdaraS3/UdaraS3.ino
; (now decomposed into this project's normal src/ structure; that sketch
; folder is deleted, this env is the one source of truth for the S3 build).
; Explicit opt-in only (`pio run -e esp32-s3-devkitc-1`) — the DevKitC V4
; env above stays the default. Uses different pins throughout (see
; include/config.h's CONFIG_IDF_TARGET_ESP32S3 block) and a different
; graphics library, since Arduino_GFX rather than TFT_eSPI was what was
; actually verified working against this ST7796 panel wired to the S3
; board — both target the same physical ST7796 4.0" 480x320 panel.
; ============================================================================
[env:esp32-s3-devkitc-1]
extends = base
board = esp32-s3-devkitc-1
; The stock `esp32-s3-devkitc-1` board id in this platform version targets
; the N8 (8MB flash, no PSRAM) variant — there's no separate stock id for
; N16R8 (16MB flash / 8MB octal PSRAM), so board_build.*/board_upload.*
; below override it, modeled on another 16MB+OPI-PSRAM S3 board definition
; already shipped in this same platform version (`board_build.json` for
; `4d_systems_esp32s3_gen4_r8n16`, R8N16 = same PSRAM/flash combo as
; N16R8, just written in the opposite order).
; NOT yet build-verified in this sandbox (no working `pio` CLI available
; here, see firmware/README.md "Known placeholders") — re-check against a
; real `pio run` on an actual N16R8 module before trusting this blindly.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_speed = 921600
lib_deps =
    ${base.lib_deps}
    ; Pinned exact (not `^1.4.9`) — newer releases (checked: 1.6.7, the
    ; latest as of this writing) need esp32-hal-periman.h, added to
    ; arduino-esp32 core 3.x; this platform version's cached
    ; framework-arduinoespressif32 is core 2.0.17, which doesn't have it,
    ; and fails the build with "esp32-hal-periman.h: No such file or
    ; directory" (build-verified in this sandbox — see
    ; firmware/README.md "Known placeholders"). 1.4.9 predates that
    ; dependency (confirmed against its GitHub source) and is confirmed
    ; building clean here; a caret range would let PlatformIO silently
    ; pick an incompatible newer version again.
    moononournation/GFX Library for Arduino@1.4.9
build_flags =
    ${base.build_flags}
    -DBOARD_HAS_PSRAM
    ; If `pio device monitor` shows nothing on your specific N16R8 board,
    ; it may be a native-USB (not USB-UART-bridge) board needing
    ; -DARDUINO_USB_CDC_ON_BOOT=1 added here too — board-specific, not
    ; added by default since assuming it wrong can break the USB port.
build_src_filter =
    +<*>
    -<display/display_tftespi.cpp>   ; TFT_eSPI backend — DevKitC V4 board
                                      ; only, not a dependency of this env
