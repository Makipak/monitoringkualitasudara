; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Device: ESP32 DevKitC V4 (WROOM-32D). Board id `esp32doit-devkit-v1`
; is the closest match in platformio-boards.json for a bare DevKitC V4;
; adjust if PlatformIO ships a more specific `esp32-devkitc` id by the
; time you build (check with `pio boards esp32` on your machine).

monitor_speed = 115200
upload_speed = 921600

; -DBOARD_HAS_PSRAM and similar flags are omitted — DevKitC V4 WROOM-32D
; has no PSRAM. Add if you swap to a WROVER module.
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h    ; project-local TFT_eSPI pin config,
                                      ; see include/User_Setup.h
    -DMQTT_MAX_PACKET_SIZE=512        ; PubSubClient default (256B) is tight
                                      ; once device_id + 7 float fields are
                                      ; serialized

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    bodmer/TFT_eSPI@^2.5.43
    claws/BH1750@^1.3.0
    fu-hsi/PMS@^1.1.0
    sensirion/Sensirion I2C SCD30@^1.1.0
    adafruit/Adafruit SGP30 Sensor@^2.0.3
    adafruit/Adafruit BusIO@^1.16.1
    seeed-studio/Seeed Arduino MultiGas@^1.0.1

; TFT_eSPI needs pin/driver config via a User_Setup header — this project
; injects include/User_Setup.h via build_flags above instead of editing
; the library's bundled User_Setup.h (which `pio lib update` would
; overwrite). Without this the display library won't know which
; driver/pins to use and the build will fail.
