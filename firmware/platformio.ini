; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Device: ESP32 DevKitC V4 (WROOM-32D). Board id `esp32doit-devkit-v1`
; is the closest match in platformio-boards.json for a bare DevKitC V4;
; adjust if PlatformIO ships a more specific `esp32-devkitc` id by the
; time you build (check with `pio boards esp32` on your machine).

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    bodmer/TFT_eSPI@^2.5.43
    claws/BH1750@^1.3.0
    lewapek/SdsDustSensor@^1.4               ; SDS011 (PM2.5/PM10), replaces PMS5003
    wifwaf/MH-Z19@^1.5.4                      ; MH-Z19B (CO2), replaces SCD30
    adafruit/Adafruit SGP30 Sensor@^2.0.3
    adafruit/Adafruit SHT31 Library@^2.2.2    ; GY-SHT31, room temperature
                                               ; (published + stored, excluded
                                               ; from thresholds/alerts)
    adafruit/Adafruit BusIO@^1.16.1
    seeed-studio/Seeed Arduino MultiGas@^1.0.1

; Library status (rule.md 2: no deprecated/unmaintained deps) — re-check
; SdsDustSensor and MH-Z19 maintenance activity before relying on them for
; the actual build, since both were picked as fast substitutions when the
; originally planned sensors (PMS5003, SCD30) had long seller pre-order
; times (see architecture.md 2.1).

; -DBOARD_HAS_PSRAM and similar flags are omitted — DevKitC V4 WROOM-32D
; has no PSRAM. Add if you swap to a WROVER module.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DMQTT_MAX_PACKET_SIZE=512        ; PubSubClient default (256B) is tight
                                      ; once device_id + 7 float params +
                                      ; temperature are serialized

; --- Official build target: final ST7796 4.0" 480x320 hardware --------
; This is the default environment (`pio run` with no -e picks it) and
; the one that reflects the actual product decision in architecture.md.
[env:esp32doit-devkit-v1]
extends = base
build_flags =
    ${base.build_flags}
    -include include/User_Setup.h    ; final display config, see that file

; --- Temporary bench-test target: interim 2.4" ILI9341-family display --
; Only for testing firmware (sensors/network/etc.) before the ST7796 4.0"
; unit (still in transit) arrives — see architecture.md 2.2 "Catatan
; development sementara" and include/User_Setup_Dev.h. Build explicitly
; with `pio run -e esp32doit-devkit-v1-dev-display`; never the default.
[env:esp32doit-devkit-v1-dev-display]
extends = base
build_flags =
    ${base.build_flags}
    -include include/User_Setup_Dev.h

; TFT_eSPI needs pin/driver config via a User_Setup header — each env
; above injects its own via build_flags instead of editing the library's
; bundled User_Setup.h (which `pio lib update` would overwrite). Without
; this the display library won't know which driver/pins to use and the
; build will fail.
